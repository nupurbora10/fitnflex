<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitnFlex – Links</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #ffffff;
        text-align: center;
        color: #222;
    }

    .container {
        max-width: 450px;
        margin: auto;
        padding: 25px;
    }

    /* LOGO */
    .logo {
        width: 180px;
        margin: 15px auto 25px auto;
    }

    /* GRADIENT BUTTONS */
    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #83FF4E, #0B6623);
        color: white;
        text-decoration: none;
        padding: 14px 20px;
        border-radius: 12px;
        margin: 10px 0;
        font-size: 18px;
        font-weight: bold;
        transition: 0.2s;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    }

    .btn:hover {
        transform: scale(1.03);
    }

    .btn img {
        width: 22px;
        height: 22px;
        margin-right: 10px;
    }

    /* QR CODE SECTION */
    .qr-section {
        margin-top: 30px;
    }

    .qr-section img {
        width: 200px;
        border-radius: 10px;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <img src="logo.png" class="logo" alt="FitnFlex Logo">

    <h1>Welcome to FitnFlex</h1>

    <!-- MENU BUTTON -->
    <a class="btn" href="#" target="_blank">
        🍽️ View Menu
    </a>

    <!-- PLATFORM LINKS -->
    <a class="btn" href="#" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png"> Instagram
    </a>

    <a class="btn" href="#" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968885.png"> Swiggy
    </a>

    <a class="btn" href="#" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/831/831329.png"> Zomato
    </a>

    <a class="btn" href="#" target="_blank">
        📱 Download App
    </a>

    <!-- QR CODE SECTION -->
    <div class="qr-section">
        <h2>Scan to open this page</h2>

        <!-- AUTO GENERATED QR CODE — replace YOUR-LINK-HERE -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=YOUR-LINK-HERE" alt="QR Code">
    </div>

</div>

</body>
</html>
